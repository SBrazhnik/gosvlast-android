name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Подставить адрес data.json этого репозитория
        run: |
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/data.json"
          sed -i "s#__DATA_URL__#${URL}#" app/src/main/assets/index.html
          echo "DATA_URL=${URL}"

      - name: Собрать APK
        run: gradle --no-daemon assembleRelease

      - name: Переименовать
        run: cp app/build/outputs/apk/release/app-release.apk GosVlast-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GosVlast-apk
          path: GosVlast-*.apk

      - name: Релиз (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GosVlast-*.apk
